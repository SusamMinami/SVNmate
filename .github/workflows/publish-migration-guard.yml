name: Publish MigrationGuard Module

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-migration-guard.yml
      - migration_guard/**
      - migration_guard_app.py
      - MigrationGuard.spec
      - build_migration_guard.bat
      - svnmate_core/**
      - svnmate_ipc.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Run MigrationGuard tests
        run: >
          python -B -m unittest
          test_migration_audit
          test_jira_client
          test_remote_asset_progress
          test_ticket_mapping
          test_batch_workflow
          test_asset_tree
          test_migration_guard_app
          test_svnmate_core
          test_svnmate_ipc
          -v

      - name: Build MigrationGuard
        run: python -m PyInstaller --noconfirm MigrationGuard.spec

      - name: Prepare module assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content "migration_guard/VERSION" -Raw).Trim()
          New-Item -ItemType Directory -Force "release/MigrationGuard" | Out-Null
          Copy-Item "dist/MigrationGuard.exe" "release/MigrationGuard/MigrationGuard.exe"
          Copy-Item "migration_guard/VERSION" "release/MigrationGuard/VERSION"
          Copy-Item "README_migration_guard.md" "release/MigrationGuard/README.md"
          Compress-Archive -Path "release/MigrationGuard/*" -DestinationPath "MigrationGuard.zip" -Force
          $sha256 = (Get-FileHash "MigrationGuard.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            id = "migration-guard"
            version = $version
            download_url = "https://github.com/SusamMinami/SVNmate/releases/download/migration-guard-latest/MigrationGuard.zip"
            sha256 = $sha256
            entrypoint = "MigrationGuard.exe"
          } | ConvertTo-Json
          [IO.File]::WriteAllText(
            (Join-Path $PWD "manifest.json"),
            $manifest + [Environment]::NewLine,
            (New-Object Text.UTF8Encoding($false))
          )

      - name: Create or update fixed module release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          gh release view migration-guard-latest 2> $null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = "Stop"
          if ($releaseExists) {
            gh release upload migration-guard-latest "MigrationGuard.zip" "manifest.json" --clobber
            gh release edit migration-guard-latest --latest=false
          } else {
            gh release create migration-guard-latest "MigrationGuard.zip" "manifest.json" `
              --title "MigrationGuard latest module" `
              --notes "Fixed update channel for the MigrationGuard Windows module." `
              --latest=false
          }
