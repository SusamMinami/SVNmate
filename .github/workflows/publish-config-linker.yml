name: Publish ConfigLinker Module

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-config-linker.yml
      - config_id_lookup/**
      - module_updates.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Run ConfigLinker tests
        working-directory: config_id_lookup
        run: python -B -m unittest discover -s tests -v

      - name: Build ConfigLinker
        working-directory: config_id_lookup
        run: python -m PyInstaller --noconfirm ConfigLinker.spec

      - name: Prepare module assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content "config_id_lookup/VERSION" -Raw).Trim()
          New-Item -ItemType Directory -Force "release/ConfigLinker" | Out-Null
          Copy-Item "config_id_lookup/dist/ConfigLinker.exe" "release/ConfigLinker/ConfigLinker.exe"
          Copy-Item "config_id_lookup/VERSION" "release/ConfigLinker/VERSION"
          Compress-Archive -Path "release/ConfigLinker/*" -DestinationPath "ConfigLinker.zip" -Force
          $sha256 = (Get-FileHash "ConfigLinker.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            id = "config-linker"
            version = $version
            download_url = "https://github.com/SusamMinami/SVNmate/releases/download/config-linker-latest/ConfigLinker.zip"
            sha256 = $sha256
            entrypoint = "ConfigLinker.exe"
          } | ConvertTo-Json | Set-Content "manifest.json" -Encoding utf8

      - name: Create or update fixed module release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release view config-linker-latest 2> $null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload config-linker-latest "ConfigLinker.zip" "manifest.json" --clobber
            gh release edit config-linker-latest --latest=false
          } else {
            gh release create config-linker-latest "ConfigLinker.zip" "manifest.json" `
              --title "ConfigLinker latest module" `
              --notes "Fixed update channel for the ConfigLinker Windows module." `
              --latest=false
          }
