name: Publish SVNmate Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-release.yml
      - RELEASE_NOTES.md
      - README_svn_auto_tool.md
      - svn_auto_tool.py
      - svnmate_cli.py
      - svnmate_update_client.py
      - svnmate_ipc.py
      - svnmate_core/**
      - svnmate_theme.py
      - tool_modules.py
      - module_updates.py
      - SVNAutoTool.spec
      - SVNmateCLI.spec
      - svnmate.ico
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Run shared runtime tests
        run: >
          python -B -m unittest
          test_svn_auto_tool
          test_svnmate_core
          test_svnmate_ipc
          test_tool_modules
          test_module_updates
          test_migration_audit
          test_batch_workflow
          test_selective_update
          -v

      - name: Build GUI and CLI
        run: |
          python -m PyInstaller --noconfirm SVNAutoTool.spec
          python -m PyInstaller --noconfirm SVNmateCLI.spec

      - name: Prepare release asset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force "release/SVNmate" | Out-Null
          Copy-Item "dist/SVNAutoTool.exe" "release/SVNmate/SVNAutoTool.exe"
          Copy-Item "dist/SVNmateCLI.exe" "release/SVNmate/SVNmateCLI.exe"
          Copy-Item "svnmate.ico" "release/SVNmate/svnmate.ico"
          Copy-Item "README_svn_auto_tool.md" "release/SVNmate/README.md"
          Compress-Archive `
            -Path "release/SVNmate/*" `
            -DestinationPath "SVNmate.zip" `
            -Force

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          gh release view v1.5.0 2> $null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = "Stop"
          if ($releaseExists) {
            gh release upload v1.5.0 "SVNmate.zip" --clobber
          } else {
            gh release create v1.5.0 "SVNmate.zip" `
              --title "一键更新SVN v1.5.0" `
              --notes-file RELEASE_NOTES.md
          }
          gh release edit v1.5.0 `
            --title "一键更新SVN v1.5.0" `
            --notes-file RELEASE_NOTES.md `
            --latest
