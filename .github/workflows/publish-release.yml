name: Publish Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-release.yml
      - RELEASE_NOTES.md
      - 一键更新SVN.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare release asset
        run: cp "一键更新SVN.zip" "SVNmate.zip"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view v1.3.4 >/dev/null 2>&1; then
            gh release upload v1.3.4 "SVNmate.zip" --clobber
          else
            gh release create v1.3.4 "SVNmate.zip" \
              --title "一键更新SVN v1.3.4" \
              --notes-file RELEASE_NOTES.md
          fi
